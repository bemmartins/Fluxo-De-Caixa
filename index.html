<!doctype html>
<!--
  ============================================================================
  FLUXO DE CAIXA – TESOURARIA (Rioprevidência)
  Painel em um único arquivo HTML: estilo (CSS), estrutura (HTML) e lógica (JavaScript).
  ============================================================================

  O QUE O PAINEL FAZ
  - Lê as planilhas de conciliação bancária (aba "C.C") e extratos simples (.csv/.xlsx).
  - Mostra o fluxo de caixa por PLANO: Taxa, Financeiro, Militar e Previdenciário.
    Não separa por conta corrente: cada planilha entra no plano dela.
  - Telas (abas no topo): Visão geral · uma por plano · Relatórios (para imprimir) · Planilhas.

  REGRAS DE NEGÓCIO
  - Entram as linhas de RECEITA e DESPESA, separadas por natureza (com subdivisões).
  - Linhas NP = APORTE (categoria própria, separada de receita). NP positiva entra, negativa sai.
  - Das transferências (TRANSF.), só entram as do aporte do Financeiro para o Militar:
      no Financeiro aparecem como "Repasse de aporte ao Plano Militar" (saída)
      no Militar aparecem como "Aporte recebido do Plano Financeiro" (entrada)
    No total geral os dois lados se anulam (nada é contado em dobro).
    Quais transferências são aporte é escolhido na tela do Militar ou na aba Planilhas.
  - Resultado = receitas + aportes − despesas.
  - FI (aplicações/resgates) e as demais transferências ficam de fora.

  COMO O PLANO DE CADA PLANILHA É RECONHECIDO (função planoOf)
  1. Escolha manual na aba Planilhas (fica guardada).
  2. Nome do arquivo ou da pasta: Taxa/Adm, Fin/Financeiro, Mil/Militar, Prev/Previdenciário
     (ex.: pasta "P. Militar").
  3. Conteúdo da planilha: "Plano Financeiro" nas observações, "Fundo em Repartição"
     (Financeiro), "Fundo em Capitalização" (Previdenciário), "Taxa de Administração", "Plano Militar".

  DE ONDE VÊM AS PLANILHAS (aba Planilhas)
  a) SharePoint pelo Microsoft Graph (login com a conta do trabalho; atualiza sozinho).
     Precisa de um aplicativo registrado no Azure (tipo SPA, permissões delegadas
     Files.Read.All e Sites.Read.All) e do painel publicado num endereço https.
     Para todos já abrirem configurado, preencha SP_DEFAULT no script (procure por "SP_DEFAULT").
  b) Pasta sincronizada no computador (OneDrive) – Edge/Chrome guardam a pasta escolhida.
  c) Upload manual (arrastar ou escolher arquivos).
  Os dados ficam no navegador de quem usa (IndexedDB). Nada é enviado para outro servidor.

  BIBLIOTECA EXTERNA
  - SheetJS (xlsx 0.18.5) para ler arquivos do Excel.
  ============================================================================
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fluxo de Caixa – Tesouraria</title>
    <link rel="icon" type="image/png" href="img/favicon.png" />
    <link rel="apple-touch-icon" href="img/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap"
    />
    <!-- estilo do painel -->
    <link rel="stylesheet" href="css/estilo.css" />
    <!-- SheetJS: leitura de arquivos do Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="bg-shade" aria-hidden="true"></div>

    <header class="topbar">
      <div class="wrap">
        <div class="bar glass">
          <div class="brand">
            <img class="logo" src="img/logo.jpg" alt="Rioprevidência" width="34" height="34" />
            <div><b>Fluxo de Caixa</b><small>Rioprevidência · Tesouraria</small></div>
          </div>
          <nav class="nav" id="nav" aria-label="Telas">
            <span class="npill" id="navPill" aria-hidden="true"></span>
            <a href="#geral" data-v="geral">Visão geral</a>
            <a href="#taxa" data-v="taxa"><i style="background: var(--taxa)"></i>Taxa</a>
            <a href="#financeiro" data-v="financeiro"><i style="background: var(--fin)"></i>Financeiro</a>
            <a href="#militar" data-v="militar"><i style="background: var(--mil)"></i>Militar</a>
            <a href="#previdenciario" data-v="previdenciario"
              ><i style="background: var(--prev)"></i>Previdenciário</a
            >
            <a href="#relatorios" data-v="relatorios">Relatórios</a>
            <a href="#planilhas" data-v="planilhas"
              >Planilhas <span class="badge" id="navBadge" hidden></span
            ></a>
          </nav>
          <div class="tools">
            <input type="file" id="file" accept=".xlsx,.xls,.xlsm,.csv,.txt,.ods" multiple hidden />
            <input type="file" id="foldIn" webkitdirectory multiple hidden />
            <button class="btn" id="btnSync" type="button" hidden title="Ler a pasta de novo">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path
                  d="M21 12a9 9 0 0 1-15.4 6.4L3 16M3 12a9 9 0 0 1 15.4-6.4L21 8M21 3v5h-5M3 21v-5h5"
                /></svg
              ><span class="lbl">Atualizar tudo</span>
            </button>
            <button class="btn acc" id="btnLoad" type="button">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2.4"
                stroke-linecap="round"
              >
                <path d="M12 5v14M5 12h14" /></svg
              ><span class="lbl">Planilhas</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main class="wrap">
      <div class="report" id="report"></div>
      <div class="view" id="view"></div>
    </main>

    <div class="drop" id="drop" hidden>
      <div><b>Solte as planilhas</b><span>.xlsm, .xlsx, .xls ou .csv · várias de uma vez</span></div>
    </div>
    <div class="loading" id="loading" hidden>Lendo planilhas…</div>

    <!-- leitor das planilhas e painel (a ordem importa: o leitor vem primeiro) -->
    <script src="js/leitor.js"></script>
    <script src="js/painel.js"></script>
  </body>
</html>
