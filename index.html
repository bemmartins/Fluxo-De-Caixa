    /* Lê os arquivos da pasta (ou do SharePoint). Só abre de novo o que mudou (tamanho/data). */
    async function readEntries(entries, force) {

        if (!seen.has(p)) {
          if (!files[p].ignored) saiu.push(p);
          delete files[p];
        }
      const todo = entries.filter(
        ([p, f]) =>
          force ||
          !files[p] ||
          files[p].sig !== f.size + ":" + f.lastModified ||
          (!files[p].ignored && (files[p].pv || 1) < PARSER_V),
      );
      let i = 0;
      for (const [p, f] of todo) {
        setLoading(`Lendo ${++i} de ${todo.length}: ${f.name}`);
        await new Promise((r) => setTimeout(r, 0));
        const sig = f.size + ":" + f.lastModified;
        try {
          const sheets = await sheetsOf(f);

            ign.push(p);
            continue;
          }
          const was = files[p] && !files[p].ignored;
          files[p] = {
            sig,
            pv: PARSER_V,
            lastModified: f.lastModified,
            file: f.name,
            name: a.name,
            title: a.title,

            sheet: a.sheet,

      return {

        saiu,
        erros,

    /* arquivos da pasta com o mesmo nome (sem data, mês ou trimestre) viram uma planilha só */
    /* Junta os arquivos da pasta em planilhas: arquivos com o mesmo nome (ex.: um por trimestre) viram uma só. */
    function compose() {

    async function spResolve(raw) {
      const u = spNormUrl(raw);
      let x;
      try {
        x = new URL(u);
      } catch (e) {
        throw new Error(
          "o link da pasta não parece um endereço do SharePoint. Copie o endereço da pasta na barra do navegador.",
        );
      }
      if (!/sharepoint\.com$/i.test(x.hostname))
        throw new Error("o link precisa ser de um endereço sharepoint.com.");
      try {
        const it = await g(`/shares/${spShareToken(u)}/driveItem`);
        if (it.folder)
          return { driveId: it.parentReference.driveId, id: it.id, name: it.name, webUrl: it.webUrl };
      } catch (e) {
        if (e.login) throw e;
      }
      const segs = decodeURIComponent(x.pathname).split("/").filter(Boolean);
      let sitePath = "",
        rest = segs;
      if (/^(sites|teams)$/i.test(segs[0] || "")) {
        sitePath = segs.slice(0, 2).join("/");
        rest = segs.slice(2);
      }
      const site = await g(
        sitePath
          ? `/sites/${x.hostname}:/${sitePath.split("/").map(encodeURIComponent).join("/")}`
          : `/sites/${x.hostname}`,
      );

        let dl = "";
        try {
          const ds = decodeURIComponent(new URL(d.webUrl).pathname).split("/").filter(Boolean);
          dl = ds[ds.length - 1] || "";
        } catch (e) {}
        if (!rest.length || (norm(dl) !== norm(rest[0]) && norm(d.name) !== norm(rest[0]))) continue;
        const rel = rest.slice(1);
        const it = await g(
          rel.length
            ? `/drives/${d.id}/root:/${rel.map(encodeURIComponent).join("/")}`
            : `/drives/${d.id}/root`,
        );
        if (!it.folder) throw new Error("o link aponta para um arquivo. Cole o link da pasta.");

      while (next) {
        const j = await g(next);
        for (const it of j.value || []) {
          if (it.name.startsWith("~$") || it.name.startsWith(".")) continue;
          if (it.folder) {
            if (depth < 3) await spList(driveId, it.id, prefix + it.name + "/", depth + 1, out);
            continue;
          }
          if (!it.file || !/\.(xlsm|xlsx|xls|csv)$/i.test(it.name)) continue;
          const dl = it["@microsoft.graph.downloadUrl"];
          out.push([
            prefix + it.name,
            {
              name: it.name,
              size: it.size || 0,
              lastModified: Date.parse(it.lastModifiedDateTime) || 0,
              arrayBuffer: async () => {
                let r;
                if (dl) r = await fetch(dl);
                else {
                  const at = await spAccess();

                    `https://graph.microsoft.com/v1.0/drives/${driveId}/items/${it.id}/content`,

    /* ---------- apresentação em PowerPoint ----------
   Gera um .pptx no próprio navegador (PptxGenJS), com os números do período e do plano escolhidos.
   Gráficos nativos (editáveis no PowerPoint), anotações do apresentador em cada slide. */
    const PPTX_URL = "https://cdn.jsdelivr.net/npm/pptxgenjs@4.0.1/dist/pptxgen.bundle.js";
    function loadScript(src) {
      return new Promise((res, rej) => {
        if (window.PptxGenJS) return res();
        const s = document.createElement("script");
        s.src = src;
        s.onload = () => (window.PptxGenJS ? res() : rej(new Error("o gerador de PowerPoint não carregou.")));
        s.onerror = () =>
          rej(
            new Error("não consegui carregar o gerador de PowerPoint. Confira a internet e tente de novo."),
          );
        document.head.appendChild(s);
      });
    }
    const PX = {
      ink: "EAF3FB",
      muted: "A9C1D9",
      faint: "6E8BA8",
      card: "0E2740",
      card2: "143454",
      line: "23496E",
      accent: "4FB0F0",
      pos: "6FD8A6",
      neg: "F28F84",
      apo: "DDEBFA",
      warn: "F3C46E",
      taxa: "A98CF7",
      financeiro: "F2BA4E",
      militar: "3FCCB0",
      previdenciario: "F18C5F",
      sem: "7D93AA",
    };
    const PF = "Calibri";
    /* fundo azul-marinho com brilhos (gradiente não existe no PowerPoint como preenchimento simples, então vira imagem) */
    function deckBg(strong) {
      const c = document.createElement("canvas");
      c.width = 1920;
      c.height = 1080;
      const g = c.getContext("2d");
      const lg = g.createLinearGradient(0, 0, 0, 1080);
      lg.addColorStop(0, "#0B243B");
      lg.addColorStop(0.6, "#06131F");
      lg.addColorStop(1, "#050F19");
      g.fillStyle = lg;
      g.fillRect(0, 0, 1920, 1080);
      const glow = (x, y, r, a) => {
        const rg = g.createRadialGradient(x, y, 0, x, y, r);
        rg.addColorStop(0, `rgba(46,132,214,${a})`);
        rg.addColorStop(1, "rgba(46,132,214,0)");
        g.fillStyle = rg;
        g.fillRect(0, 0, 1920, 1080);
      };
      glow(180, -80, strong ? 1100 : 900, strong ? 0.5 : 0.32);
      glow(1800, 140, strong ? 900 : 700, strong ? 0.38 : 0.22);
      glow(1000, 1300, 1000, strong ? 0.4 : 0.28);
      return c.toDataURL("image/jpeg", 0.86).replace(/^data:/, "");
    }
    function unitFor(max) {
      if (max >= 1e9) return { d: 1e9, u: "R$ bilhões", f: "#,##0.0" };
      if (max >= 1e6) return { d: 1e6, u: "R$ milhões", f: "#,##0.0" };
      if (max >= 1e3) return { d: 1e3, u: "R$ mil", f: "#,##0" };
      return { d: 1, u: "R$", f: "#,##0" };
    }
    const cut = (s, n) => {
      s = String(s || "");
      return s.length > n ? s.slice(0, n - 1).trim() + "…" : s;
    };
    /* ---------- animações da apresentação ----------
   A biblioteca do PowerPoint não grava animações, então elas são escritas direto no XML de cada slide:
   - transição em esmaecer entre os slides;
   - os elementos entram sozinhos (sem precisar clicar), em ondas: cada cartão entra junto com o que tem dentro;
   - textos e cartões sobem esmaecendo; gráficos de coluna crescem de baixo, barras e linhas da esquerda, rosca em roda. */
    async function animarDeck(z) {
      const EMU = 914400,
        P = new DOMParser();
      let id = 0;
      const nomes = Object.keys(z.files).filter((n) => /^ppt\/slides\/slide\d+\.xml$/.test(n));
      for (const nm of nomes) {
        let xml = await z.file(nm).async("string");
        // a biblioteca às vezes repete o id de formas (tabelas e número do slide); ids repetidos fazem o PowerPoint pedir "Reparar"
        {
          let nid = 1;
          xml = xml.replace(/<p:cNvPr id="\d+"/g, () => `<p:cNvPr id="${nid++}"`);
        }
        z.file(nm, xml);
        if (xml.includes("<p:timing")) continue;
        const rels = z.file(nm.replace("slides/", "slides/_rels/") + ".rels");
        const relXml = rels ? await rels.async("string") : "";
        const doc = P.parseFromString(xml, "application/xml");
        const tree = doc.getElementsByTagName("p:spTree")[0];
        if (!tree) continue;
        const els = [];
        for (const el of [...tree.children]) {
          const tag = el.tagName;
          if (!["p:sp", "p:pic", "p:graphicFrame"].includes(tag)) continue;
          const raw = new XMLSerializer().serializeToString(el);
          if (/type="slidenum"|type="sldNum"/.test(raw)) continue; // número do slide fica parado
          const c = el.getElementsByTagName("p:cNvPr")[0],
            off = el.getElementsByTagName("a:off")[0],
            ext = el.getElementsByTagName("a:ext")[0];
          if (!c || !off || !ext) continue;
          const x = +off.getAttribute("x"),
            y = +off.getAttribute("y"),
            w = +ext.getAttribute("cx"),
            h = +ext.getAttribute("cy");
          let fx = "sobe";
          if (tag === "p:graphicFrame" && raw.includes('/chart"')) {
            const rid = (raw.match(/<c:chart[^>]*r:id="([^"]+)"/) || [])[1];
            const alvo =
              rid &&
              (relXml.match(new RegExp('Id="' + rid + '"[^>]*Target="([^"]+)"')) ||
                relXml.match(new RegExp('Target="([^"]+)"[^>]*Id="' + rid + '"')) ||
                [])[1];
            const cx = alvo
              ? await (
                  z.file(alvo.startsWith("/") ? alvo.slice(1) : "ppt/" + alvo.replace(/^\.\.\//, "")) || {
                    async: async () => "",
                  }
                ).async("string")
              : "";
            fx = cx.includes("<c:doughnutChart")
              ? "roda"
              : cx.includes("<c:lineChart")
                ? "esq"
                : /<c:barDir val="bar"/.test(cx)
                  ? "esq"
                  : "baixo";
          }
          const card = tag === "p:sp" && !raw.includes("<a:t>") && w > EMU * 0.8 && h > EMU * 0.5;
          els.push({
            spid: c.getAttribute("id"),
            tag,
            x,
            y,
            w,
            h,
            fx,
            card,
            temTexto: raw.includes("<a:t>"),
            bld:
              tag === "p:sp"
                ? raw.includes("<p:txBody")
                  ? "P"
                  : ""
                : tag === "p:graphicFrame" && raw.includes('/chart"')
                  ? "G"
                  : "",
          });
        }
        if (!els.length) continue;
        // cada elemento vai com o menor cartão que o contém
        const tol = EMU * 0.02;
        for (const e of els) {
          let best = null;
          for (const k of els) {
            if (k === e || !k.card) continue;
            if (
              e.x >= k.x - tol &&
              e.y >= k.y - tol &&
              e.x + e.w <= k.x + k.w + tol &&
              e.y + e.h <= k.y + k.h + tol &&
              (!best || k.w * k.h < best.w * best.h)
            )
              best = k;
          }
          e.dono = best;
        }
        const raiz = (e) => {
          while (e.dono) e = e.dono;
          return e;
        };
        const grupos = new Map();
        for (const e of els) {
          const r = raiz(e);
          if (!grupos.has(r)) grupos.set(r, []);
          grupos.get(r).push(e);
        }
        const ordem = [...grupos.keys()].sort(
          (a, b) => Math.round(a.y / (EMU * 0.3)) - Math.round(b.y / (EMU * 0.3)) || a.x - b.x,
        );
        let n = 2,
          par = "",
          bld = "";
        const passo = 180;
        ordem.forEach((g, gi) => {
          const membros = grupos.get(g).sort((a, b) => (a === g ? -1 : b === g ? 1 : a.y - b.y || a.x - b.x));
          membros.forEach((e, mi) => {
            const atraso = gi * passo + (mi ? 60 : 0),
              first = gi === 0 && mi === 0;
            const t = () => ++n,
              alvoEl = `<p:tgtEl><p:spTgt spid="${e.spid}"/></p:tgtEl>`;
            const set = `<p:set><p:cBhvr><p:cTn id="${t()}" dur="1" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst></p:cTn>${alvoEl}<p:attrNameLst><p:attrName>style.visibility</p:attrName></p:attrNameLst></p:cBhvr><p:to><p:strVal val="visible"/></p:to></p:set>`;
            let preset, sub, corpo;
            if (e.fx === "sobe") {
              preset = 42;
              sub = 0;
              const tav = (a, b) =>
                `<p:tavLst><p:tav tm="0"><p:val><p:strVal val="${a}"/></p:val></p:tav><p:tav tm="100000"><p:val><p:strVal val="${b}"/></p:val></p:tav></p:tavLst>`;
              corpo =
                `<p:animEffect transition="in" filter="fade"><p:cBhvr><p:cTn id="${t()}" dur="600"/>${alvoEl}</p:cBhvr></p:animEffect>` +
                `<p:anim calcmode="lin" valueType="num"><p:cBhvr><p:cTn id="${t()}" dur="600" decel="100000" fill="hold"/>${alvoEl}<p:attrNameLst><p:attrName>ppt_x</p:attrName></p:attrNameLst></p:cBhvr>${tav("#ppt_x", "#ppt_x")}</p:anim>` +
                `<p:anim calcmode="lin" valueType="num"><p:cBhvr><p:cTn id="${t()}" dur="600" decel="100000" fill="hold"/>${alvoEl}<p:attrNameLst><p:attrName>ppt_y</p:attrName></p:attrNameLst></p:cBhvr>${tav("#ppt_y+.04", "#ppt_y")}</p:anim>`;
            } else if (e.fx === "roda") {
              preset = 21;
              sub = 1;
              corpo = `<p:animEffect transition="in" filter="wheel(1)"><p:cBhvr><p:cTn id="${t()}" dur="1000"/>${alvoEl}</p:cBhvr></p:animEffect>`;
            } else {
              const b = e.fx === "baixo";
              preset = 22;
              sub = b ? 4 : 8;
              corpo = `<p:animEffect transition="in" filter="${b ? "wipe(up)" : "wipe(right)"}"><p:cBhvr><p:cTn id="${t()}" dur="${b ? 900 : 1000}"/>${alvoEl}</p:cBhvr></p:animEffect>`;
            }
            const cid = ++n;
            par += `<p:par><p:cTn id="${cid}" presetID="${preset}" presetClass="entr" presetSubtype="${sub}" fill="hold"${e.bld ? ' grpId="0"' : ""} nodeType="${first ? "afterEffect" : "withEffect"}"><p:stCondLst><p:cond delay="${atraso}"/></p:stCondLst><p:childTnLst>${set}${corpo}</p:childTnLst></p:cTn></p:par>`;
            if (e.bld === "P")
              bld += `<p:bldP spid="${e.spid}" grpId="0"${e.temTexto ? "" : ' animBg="1"'}/>`;
            else if (e.bld === "G")
              bld += `<p:bldGraphic spid="${e.spid}" grpId="0"><p:bldAsOne/></p:bldGraphic>`;
          });
        });
        // renumera os ids das animações em ordem crescente (o PowerPoint exige ids únicos)
        let k = 4;
        par = par.replace(/<p:cTn id="[^"]+"/g, () => `<p:cTn id="${++k}"`);
        const timing = `<p:timing><p:tnLst><p:par><p:cTn id="1" dur="indefinite" restart="never" nodeType="tmRoot"><p:childTnLst><p:seq concurrent="1" nextAc="seek"><p:cTn id="2" dur="indefinite" nodeType="mainSeq"><p:childTnLst><p:par><p:cTn id="3" fill="hold"><p:stCondLst><p:cond delay="indefinite"/><p:cond evt="onBegin" delay="0"><p:tn val="2"/></p:cond></p:stCondLst><p:childTnLst><p:par><p:cTn id="4" fill="hold"><p:stCondLst><p:cond delay="0"/></p:stCondLst><p:childTnLst>${par}</p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn></p:par></p:childTnLst></p:cTn><p:prevCondLst><p:cond evt="onPrev" delay="0"><p:tgtEl><p:sldTgt/></p:tgtEl></p:cond></p:prevCondLst><p:nextCondLst><p:cond evt="onNext" delay="0"><p:tgtEl><p:sldTgt/></p:tgtEl></p:cond></p:nextCondLst></p:seq></p:childTnLst></p:cTn></p:par></p:tnLst>${bld ? `<p:bldLst>${bld}</p:bldLst>` : ""}</p:timing>`;
        const trans = `<p:transition spd="slow"><p:fade/></p:transition>`;
        xml = xml.replace("</p:clrMapOvr>", "</p:clrMapOvr>" + trans + timing);
        z.file(nm, xml);
      }
    }

    async function buildDeck() {
      if (!ALL.length) {
        showReport([
          { ok: false, file: "Apresentação", msg: "carregue as planilhas antes de gerar a apresentação." },
        ]);
        return;
      }
      if (FRAMED && !SPR.ok) {
        showReport([
          {
            ok: false,
            file: "Apresentação",
            msg: "aqui o navegador não deixa baixar arquivos. Abra o painel no Edge ou no Chrome (arquivo no computador ou endereço publicado) e clique de novo.",
          },
        ]);
        return;
      }
      const btns = [...document.querySelectorAll('[data-act="deck"],#btnDeck')];
      btns.forEach((b) => (b.disabled = true));
      setLoading("Montando a apresentação…");
      try {
        await loadScript(PPTX_URL);
        const scope = PLM[ui.view]
          ? ui.view
          : ui.view === "relatorios" && ui.rplan !== "todos"
            ? ui.rplan
            : "todos";
        const { from, to, inP: allP } = ctx();
        const plansAll = PL.concat(allP.some((t) => t.plano === "sem") ? [SEM] : []);
        const plans = scope === "todos" ? plansAll : plansAll.filter((p) => p.k === scope);
        const inP = scope === "todos" ? allP : allP.filter((t) => t.plano === scope);
        const R = rec(inP),
          A = apo(inP),
          D = des(inP),
          X = R + A - D;
        const per = cap(periodTitle(from, to));
        const now = new Date();
        const emit = `${pad(now.getDate())}/${pad(now.getMonth() + 1)}/${now.getFullYear()} às ${pad(now.getHours())}h${pad(now.getMinutes())}`;
        const scopeTxt =
          scope === "todos" ? "Taxa · Financeiro · Militar · Previdenciário" : plInfo(scope).full;
        const pres = new PptxGenJS();
        pres.layout = "LAYOUT_WIDE";
        pres.author = "Tesouraria · Rioprevidência";
        pres.company = "Rioprevidência";
        pres.title = "Fluxo de Caixa · " + per;
        const BG = deckBg(false),
          BG2 = deckBg(true),
          LOGOD = LOGO.replace(/^data:/, "");
        const W = 13.333,
          M = 0.6;
        pres.defineSlideMaster({ title: "FC_CAPA", background: { data: BG2 } });
        pres.defineSlideMaster({
          title: "FC_CONTEUDO",
          background: { data: BG },
          objects: [
            { image: { data: LOGOD, x: M, y: 6.93, w: 0.3, h: 0.3 } },
            {
              text: {
                text: `Fluxo de Caixa · Tesouraria · ${per}`,
                options: {
                  x: M + 0.42,
                  y: 6.93,
                  w: 8,
                  h: 0.3,
                  fontFace: PF,
                  fontSize: 10,
                  color: PX.faint,
                  valign: "middle",
                  margin: 0,
                },
              },
            },
          ],
          slideNumber: {
            x: W - M - 0.6,
            y: 6.93,
            w: 0.6,
            h: 0.3,
            fontFace: PF,
            fontSize: 10,
            color: PX.faint,
            align: "right",
          },
        });
        const T = (s, text, o) =>
          s.addText(text, { fontFace: PF, color: PX.ink, isTextBox: true, margin: 0, ...o });
        const card = (s, x, y, w, h, o = {}) =>
          s.addShape(pres.shapes.ROUNDED_RECTANGLE, {
            x,
            y,
            w,
            h,
            rectRadius: 0.12,
            fill: { color: o.fill || PX.card, transparency: o.tr ?? 8 },
            line: { color: o.line || PX.line, width: 0.75 },
          });
        const dot = (s, x, y, d, color, txt) => {
          s.addShape(pres.shapes.OVAL, { x, y, w: d, h: d, fill: { color }, line: { color, width: 0 } });
          if (txt)
            T(s, txt, {
              x,
              y,
              w: d,
              h: d,
              align: "center",
              valign: "middle",
              fontSize: d * 22,
              bold: true,
              color: "06131F",
            });
        };
        let nSlide = 0;
        const base = (title, eyebrow, notes) => {
          const s = pres.addSlide({ masterName: "FC_CONTEUDO" });
          nSlide++;
          if (eyebrow)
            T(s, eyebrow.toUpperCase(), {
              x: M,
              y: 0.42,
              w: 9,
              h: 0.3,
              fontSize: 11,
              color: PX.accent,
              bold: true,
              charSpacing: 2,
            });
          T(s, title, { x: M, y: 0.72, w: W - 2 * M, h: 0.7, fontSize: 30, bold: true });
          if (notes) s.addNotes(notes);
          return s;
        };
        /* valores dos cartões: abreviados a partir de R$ 1 mi e com espaço inquebrável depois do sinal */
        const bigD = (v, signed) => {
          if (Math.abs(v) < 0.005) v = 0;
          const sg = signed && v ? (v < 0 ? "−\u00A0" : "+\u00A0") : "";
          const m = Math.abs(v) >= 1e6 ? short(Math.abs(v)).replace("−", "") : money(Math.abs(v));
          return (sg + m).replace("R$ ", "R$\u00A0");
        };
        const stat = (s, x, y, w, h, label, value, sub, color, valColor) => {
          card(s, x, y, w, h);
          s.addShape(pres.shapes.OVAL, {
            x: x + 0.28,
            y: y + 0.33,
            w: 0.14,
            h: 0.14,
            fill: { color },
            line: { color, width: 0 },
          });
          T(s, label, { x: x + 0.52, y: y + 0.24, w: w - 0.8, h: 0.32, fontSize: 13, color: PX.muted });
          T(s, value, {
            x: x + 0.28,
            y: y + 0.62,
            w: w - 0.5,
            h: 0.75,
            fontSize: h > 1.6 ? 30 : 24,
            bold: true,
            color: valColor || PX.ink,
            fit: "shrink",
          });
          if (sub)
            T(s, sub, { x: x + 0.28, y: y + h - 0.55, w: w - 0.5, h: 0.36, fontSize: 11, color: PX.faint });
        };
        const axis = (o) => ({
          catAxisLabelColor: PX.muted,
          valAxisLabelColor: PX.faint,
          catAxisLabelFontFace: PF,
          valAxisLabelFontFace: PF,
          catAxisLabelFontSize: 11,
          valAxisLabelFontSize: 10,
          valGridLine: { color: "1D3D5E", size: 0.5 },
          catGridLine: { style: "none" },
          catAxisLineShow: false,
          valAxisLineShow: false,
          dataLabelColor: PX.ink,
          dataLabelFontFace: PF,
          dataLabelFontSize: 10,
          legendColor: PX.muted,
          legendFontFace: PF,
          legendFontSize: 11,
          titleColor: PX.muted,
          titleFontFace: PF,
          titleFontSize: 12,
          ...o,
        });
        const top = (L, tipo, n) => {
          const m = new Map();
          for (const t of L.filter((t) => t.tipo === tipo)) {
            const v = Math.abs(t.value);
            m.set(t.natK, (m.get(t.natK) || 0) + v);
          }
          return [...m.entries()].sort((a, b) => b[1] - a[1]).slice(0, n);
        };

        /* 1. capa */
        {
          const s = pres.addSlide({ masterName: "FC_CAPA" });
          nSlide++;
          s.addImage({ data: LOGOD, x: M, y: 0.6, w: 0.72, h: 0.72 });
          T(s, "Rioprevidência", { x: M + 0.95, y: 0.62, w: 5, h: 0.36, fontSize: 16, bold: true });
          T(s, "Tesouraria", { x: M + 0.95, y: 0.98, w: 5, h: 0.32, fontSize: 13, color: PX.muted });
          T(s, "FLUXO DE CAIXA", {
            x: M,
            y: 2.1,
            w: 7.4,
            h: 0.4,
            fontSize: 14,
            bold: true,
            color: PX.accent,
            charSpacing: 3,
          });
          T(s, scope === "todos" ? "Fluxo de caixa por plano" : plInfo(scope).full, {
            x: M,
            y: 2.55,
            w: 7.6,
            h: 1.7,
            fontSize: 50,
            bold: true,
            valign: "top",
          });
          T(s, per, { x: M, y: 4.35, w: 7.4, h: 0.5, fontSize: 22, color: PX.ink });
          T(s, scopeTxt, { x: M, y: 4.88, w: 7.4, h: 0.4, fontSize: 14, color: PX.muted });
          T(s, `Emitido em ${emit}`, { x: M, y: 6.7, w: 6, h: 0.35, fontSize: 11, color: PX.faint });
          const cx = 8.45,
            cy = 1.95,
            cw = 4.28,
            ch = 3.85;
          card(s, cx, cy, cw, ch, { fill: PX.card2, tr: 10 });
          T(s, "Resultado do período", {
            x: cx + 0.4,
            y: cy + 0.35,
            w: cw - 0.8,
            h: 0.35,
            fontSize: 14,
            color: PX.muted,
          });
          T(s, bigD(X, true), {
            x: cx + 0.4,
            y: cy + 0.75,
            w: cw - 0.8,
            h: 0.85,
            fontSize: 38,
            bold: true,
            color: X < 0 ? PX.neg : PX.pos,
            fit: "shrink",
          });
          const rows = [
            ["Receitas", short(R), PX.pos],
            ["Aportes", A ? (A < 0 ? "− " : "+ ") + short(Math.abs(A)).replace("−", "") : "—", PX.apo],
            ["Despesas", short(D), PX.neg],
          ];
          rows.forEach(([l, v, c], i) => {
            const y = cy + 1.95 + i * 0.55;
            s.addShape(pres.shapes.OVAL, {
              x: cx + 0.42,
              y: y + 0.13,
              w: 0.13,
              h: 0.13,
              fill: { color: c },
              line: { color: c, width: 0 },
            });
            T(s, l, { x: cx + 0.68, y, w: 1.6, h: 0.4, fontSize: 14, color: PX.muted, valign: "middle" });
            T(s, v, {
              x: cx + 2.1,
              y,
              w: cw - 2.5,
              h: 0.4,
              fontSize: 15,
              bold: true,
              align: "right",
              valign: "middle",
            });
          });
          s.addNotes(
            `Fluxo de caixa ${scope === "todos" ? "por plano" : "do " + plInfo(scope).full}, ${per}. Resultado de ${sgn(X)}: receitas de ${money(R)}, aportes de ${sgn(A)} e despesas de ${money(D)}.`,
          );
        }

        /* 2. resumo */
        {
          const topR = top(inP, "RECEITA", 1)[0],
            topD = top(inP, "DESPESA", 1)[0];
          const s = base(
            "Resumo do período",
            "Visão geral",
            `Resumo: receitas ${money(R)}, aportes ${sgn(A)}, despesas ${money(D)}, resultado ${sgn(X)}.`,
          );
          const cw = 2.8,
            gap = (W - 2 * M - 4 * cw) / 3;
          [
            [
              "Receitas",
              short(R),
              plural(inP.filter((t) => t.tipo === "RECEITA").length, "crédito", "créditos"),
              PX.pos,
            ],
            [
              "Aportes",
              A ? (A < 0 ? "− " : "+ ") + short(Math.abs(A)).replace("−", "") : "R$ 0",
              `entraram ${short(apoIn(inP))}`,
              PX.apo,
            ],
            [
              "Despesas",
              short(D),
              plural(inP.filter((t) => t.tipo === "DESPESA").length, "pagamento", "pagamentos"),
              PX.neg,
            ],
            ["Resultado", bigD(X, true), "receitas + aportes − despesas", X < 0 ? PX.neg : PX.pos],
          ].forEach(([l, v, sub, c], i) =>
            stat(
              s,
              M + i * (cw + gap),
              1.7,
              cw,
              1.85,
              l,
              v,
              sub,
              c,
              i === 3 ? (X < 0 ? PX.neg : PX.pos) : null,
            ),
          );
          // destaques
          card(s, M, 3.85, 6.3, 2.75);
          T(s, "Destaques", { x: M + 0.35, y: 4.05, w: 5, h: 0.4, fontSize: 16, bold: true });
          const hl = [];
          if (topR)
            hl.push({
              k: "Maior receita",
              v: `${cut(splitCode(topR[0]).name, 46)} · ${short(topR[1])} (${pct(topR[1], R)})`,
            });
          if (topD)
            hl.push({
              k: "Maior despesa",
              v: `${cut(splitCode(topD[0]).name, 46)} · ${short(topD[1])} (${pct(topD[1], D)})`,
            });
          if (scope === "todos") {
            const best = plansAll
              .map((p) => {
                const L = allP.filter((t) => t.plano === p.k);
                return [p, rec(L) + apo(L) - des(L), L.length];
              })
              .filter((x) => x[2])
              .sort((a, b) => b[1] - a[1]);
            if (best.length) {
              hl.push({ k: "Melhor resultado", v: `${best[0][0].full} · ${sgn(best[0][1])}` });
              if (best.length > 1)
                hl.push({
                  k: "Menor resultado",
                  v: `${best[best.length - 1][0].full} · ${sgn(best[best.length - 1][1])}`,
                });
            }
          }
          hl.slice(0, 4).forEach((h, i) => {
            const y = 4.6 + i * 0.47;
            T(
              s,
              [
                { text: h.k + "  ", options: { bold: true, color: PX.accent } },
                { text: h.v, options: { color: PX.ink } },
              ],
              { x: M + 0.35, y, w: 5.7, h: 0.42, fontSize: 13, valign: "middle" },
            );
          });
          // receitas por plano
          if (scope === "todos") {
            const ds = plansAll
              .map((p) => ({ p, v: rec(allP.filter((t) => t.plano === p.k)) }))
              .filter((x) => x.v > 0);
            card(s, M + 6.6, 3.85, W - 2 * M - 6.6, 2.75);
            if (ds.length) {
              s.addChart(
                pres.charts.DOUGHNUT,
                [{ name: "Receitas", labels: ds.map((x) => x.p.l), values: ds.map((x) => Math.round(x.v)) }],
                axis({
                  x: M + 6.75,
                  y: 3.95,
                  w: W - 2 * M - 6.9,
                  h: 2.55,
                  holeSize: 62,
                  chartColors: ds.map((x) => PX[x.p.k]),
                  showPercent: true,
                  showValue: false,
                  showLegend: true,
                  legendPos: "r",
                  dataLabelColor: "06131F",
                  dataLabelFontSize: 10,
                  showTitle: true,
                  title: "Receitas por plano",
                }),
              );
            }
          } else {
            card(s, M + 6.6, 3.85, W - 2 * M - 6.6, 2.75);
            const tr = top(inP, "RECEITA", 4);
            const sum = tr.reduce((a, b) => a + b[1], 0) || 1;
            T(s, "Receitas por natureza", { x: M + 6.95, y: 4.05, w: 5, h: 0.4, fontSize: 16, bold: true });
            tr.forEach(([k, v], i) => {
              const y = 4.6 + i * 0.47;
              T(s, cut(splitCode(k).name, 36), {
                x: M + 6.95,
                y,
                w: 3.6,
                h: 0.42,
                fontSize: 12,
                color: PX.muted,
                valign: "middle",
              });
              T(s, `${short(v)} · ${pct(v, R)}`, {
                x: M + 10.4,
                y,
                w: 1.75,
                h: 0.42,
                fontSize: 12,
                bold: true,
                align: "right",
                valign: "middle",
              });
            });
          }
        }

        /* 3. resultado por plano */
        if (scope === "todos") {
          const rows = plansAll
            .map((p) => {
              const L = allP.filter((t) => t.plano === p.k);
              return { p, r: rec(L), a: apo(L), d: des(L), n: L.length };
            })
            .filter((x) => x.n);
          const s = base(
            "Resultado por plano",
            "Planos",
            rows
              .map(
                (x) =>
                  `${x.p.full}: receitas ${money(x.r)}, aportes ${sgn(x.a)}, despesas ${money(x.d)}, resultado ${sgn(x.r + x.a - x.d)}.`,
              )
              .join("\n"),
          );
          const mx = Math.max(1, ...rows.flatMap((x) => [x.r, Math.abs(x.a), x.d]));
          const u = unitFor(mx);
          card(s, M, 1.6, 7.7, 5.05);
          const series = [
            {
              name: "Receitas",
              labels: rows.map((x) => x.p.l),
              values: rows.map((x) => +(x.r / u.d).toFixed(2)),
            },
          ];
          const hasA = rows.some((x) => x.a);
          if (hasA)
            series.push({
              name: "Aportes",
              labels: rows.map((x) => x.p.l),
              values: rows.map((x) => +(x.a / u.d).toFixed(2)),
            });
          series.push({
            name: "Despesas",
            labels: rows.map((x) => x.p.l),
            values: rows.map((x) => +(x.d / u.d).toFixed(2)),
          });
          s.addChart(
            pres.charts.BAR,
            series,
            axis({
              x: M + 0.15,
              y: 1.7,
              w: 7.4,
              h: 4.85,
              barDir: "col",
              barGrouping: "clustered",
              barGapWidthPct: 60,
              chartColors: hasA ? [PX.pos, PX.apo, PX.neg] : [PX.pos, PX.neg],
              showLegend: true,
              legendPos: "b",
              showValue: true,
              dataLabelPosition: "outEnd",
              dataLabelFormatCode: u.f,
              valAxisLabelFormatCode: "#,##0",
              showTitle: true,
              title: u.u,
            }),
          );
          rows.slice(0, 5).forEach((x, i) => {
            const y = 1.6 + i * (5.05 / Math.max(4, rows.length));
            const h = 5.05 / Math.max(4, rows.length) - 0.15;
            const xx = M + 7.95,
              ww = W - M - xx;
            card(s, xx, y, ww, h);
            dot(s, xx + 0.25, y + h / 2 - 0.22, 0.44, PX[x.p.k]);
            T(s, x.p.full, { x: xx + 0.85, y: y + 0.14, w: ww - 1, h: 0.34, fontSize: 13, color: PX.muted });
            T(s, bigD(x.r + x.a - x.d, true), {
              x: xx + 0.85,
              y: y + 0.46,
              w: ww - 1,
              h: 0.5,
              fontSize: 22,
              bold: true,
              color: x.r + x.a - x.d < 0 ? PX.neg : PX.ink,
              fit: "shrink",
            });
          });
        }

        /* 4. mês a mês */
        {
          let ms = months(from, to);
          if (ms.length < 2) {
            const d = toD(to.slice(0, 8) + "01");
            ms = [];
            for (let i = 11; i >= 0; i--) {
              const x = new Date(d);
              x.setMonth(x.getMonth() - i);
              ms.push(fromD(x).slice(0, 7));
            }
          }
          const base0 = scope === "todos" ? ALL : ALL.filter((t) => t.plano === scope);
          const by = ms.map((m) => {
            const L = base0.filter((t) => t.date.startsWith(m));
            return { m, r: rec(L), a: apo(L), d: des(L), n: L.length };
          });
          const use = by.slice(by.findIndex((x) => x.n) >= 0 ? by.findIndex((x) => x.n) : 0);
          if (use.length >= 2) {
            const s = base(
              "Evolução mês a mês",
              "Tendência",
              use.map((x) => `${MESES_L[+x.m.slice(5) - 1]}: resultado ${sgn(x.r + x.a - x.d)}.`).join("\n"),
            );
            const mx = Math.max(1, ...use.flatMap((x) => [x.r, Math.abs(x.a), x.d]));
            const u = unitFor(mx);
            const labels = use.map((x) => `${MESES[+x.m.slice(5) - 1]}/${x.m.slice(2, 4)}`);
            const hasA = use.some((x) => x.a);
            const series = [{ name: "Receitas", labels, values: use.map((x) => +(x.r / u.d).toFixed(2)) }];
            if (hasA)
              series.push({ name: "Aportes", labels, values: use.map((x) => +(x.a / u.d).toFixed(2)) });
            series.push({ name: "Despesas", labels, values: use.map((x) => +(x.d / u.d).toFixed(2)) });
            card(s, M, 1.6, 8.6, 5.05);
            s.addChart(
              pres.charts.LINE,
              series,
              axis({
                x: M + 0.15,
                y: 1.7,
                w: 8.3,
                h: 4.85,
                chartColors: hasA ? [PX.pos, PX.apo, PX.neg] : [PX.pos, PX.neg],
                lineSize: 2.5,
                lineDataSymbol: "circle",
                lineDataSymbolSize: 6,
                lineSmooth: true,
                showLegend: true,
                legendPos: "b",
                valAxisLabelFormatCode: "#,##0",
                showTitle: true,
                title: u.u,
              }),
            );
            const res = use.map((x) => ({ m: x.m, v: x.r + x.a - x.d }));
            const best = res.reduce((a, b) => (b.v > a.v ? b : a)),
              worst = res.reduce((a, b) => (b.v < a.v ? b : a));
            const avg = res.reduce((a, b) => a + b.v, 0) / res.length;
            const xx = M + 8.9,
              ww = W - M - xx,
              h = 1.55;
            [
              ["Melhor mês", `${cap(MESES_L[+best.m.slice(5) - 1])}/${best.m.slice(0, 4)}`, best.v],
              ["Pior mês", `${cap(MESES_L[+worst.m.slice(5) - 1])}/${worst.m.slice(0, 4)}`, worst.v],
              ["Média mensal", "resultado por mês", avg],
            ].forEach(([l, sub, v], i) => {
              const y = 1.6 + i * (h + 0.2);
              card(s, xx, y, ww, h);
              T(s, l, { x: xx + 0.3, y: y + 0.2, w: ww - 0.6, h: 0.32, fontSize: 13, color: PX.muted });
              T(s, bigD(v, true), {
                x: xx + 0.3,
                y: y + 0.5,
                w: ww - 0.6,
                h: 0.55,
                fontSize: 22,
                bold: true,
                color: v < 0 ? PX.neg : PX.ink,
                fit: "shrink",
              });
              T(s, sub, { x: xx + 0.3, y: y + 1.05, w: ww - 0.6, h: 0.3, fontSize: 11, color: PX.faint });
            });
          }
        }

        /* 5 e 6. naturezas */
        for (const [tipo, titulo, cor, tot] of [
          ["RECEITA", "Receitas por natureza", PX.pos, R],
          ["DESPESA", "Despesas por natureza", PX.neg, D],
        ]) {
          const tp = top(inP, tipo, 8);
          if (!tp.length) continue;
          const s = base(
            titulo,
            "Naturezas",
            tp.map(([k, v]) => `${splitCode(k).name}: ${money(v)} (${pct(v, tot)}).`).join("\n"),
          );
          const u = unitFor(tp[0][1]);
          card(s, M, 1.6, 8.6, 5.05);
          s.addChart(
            pres.charts.BAR,
            [
              {
                name: titulo,
                labels: tp.map(([k]) => cut(splitCode(k).name, 42)),
                values: tp.map(([, v]) => +(v / u.d).toFixed(2)),
              },
            ],
            axis({
              x: M + 0.15,
              y: 1.7,
              w: 8.3,
              h: 4.85,
              barDir: "bar",
              chartColors: [cor],
              barGapWidthPct: 45,
              catAxisOrientation: "maxMin",
              valAxisHidden: true,
              valGridLine: { style: "none" },
              showLegend: false,
              showValue: true,
              dataLabelPosition: "outEnd",
              dataLabelFormatCode: u.f,
              showTitle: true,
              title: u.u,
              catAxisLabelFontSize: 10,
            }),
          );
          const xx = M + 8.9,
            ww = W - M - xx;
          const top3 = tp.slice(0, 3).reduce((a, b) => a + b[1], 0);
          const nTot = new Set(inP.filter((t) => t.tipo === tipo).map((t) => t.natK)).size;
          [
            [
              tipo === "RECEITA" ? "Total recebido" : "Total pago",
              bigD(tot),
              plural(inP.filter((t) => t.tipo === tipo).length, "lançamento", "lançamentos"),
            ],
            ["3 maiores naturezas", pct(top3, tot), "do total do período"],
            [
              "Naturezas no período",
              INT.format(nTot),
              tipo === "RECEITA" ? "naturezas de receita" : "naturezas de despesa",
            ],
          ].forEach(([l, v, sub], i) => {
            const y = 1.6 + i * 1.75;
            card(s, xx, y, ww, 1.55);
            T(s, l, { x: xx + 0.3, y: y + 0.2, w: ww - 0.6, h: 0.32, fontSize: 13, color: PX.muted });
            T(s, v, {
              x: xx + 0.3,
              y: y + 0.5,
              w: ww - 0.6,
              h: 0.55,
              fontSize: 24,
              bold: true,
              fit: "shrink",
            });
            T(s, sub, { x: xx + 0.3, y: y + 1.05, w: ww - 0.6, h: 0.3, fontSize: 11, color: PX.faint });
          });
        }

        /* 7. aportes */
        {
          const AP = inP.filter((t) => t.tipo === "APORTE");
          if (AP.length) {
            const m = new Map();
            for (const t of AP) {
              const k = t.plano + "|" + t.natK;
              if (!m.has(k)) m.set(k, { p: plInfo(t.plano), nat: t.natK, v: 0, n: 0 });
              const o = m.get(k);
              o.v += t.value;
              o.n++;
            }
            const rows = [...m.values()]
              .sort(
                (a, b) =>
                  PL.findIndex((p) => p.k === a.p.k) - PL.findIndex((p) => p.k === b.p.k) || b.v - a.v,
              )

    function rng(seed) {
      return () => {
        seed |= 0;
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

      const un = e.target.closest("[data-unnum]");
      if (un) {
        state.aporteNums = (state.aporteNums || []).filter(
          (n) => digits(n).replace(/^0+/, "") !== un.dataset.unnum,
        );
        await save();
        rebuild();
        render();
        return;
      }
      const del = e.target.closest("[data-del]");
      if (del) {
        if (!confirmStep(del, "Confirmar remoção")) return;
        const nm = del.closest("tr").dataset.a;
        delete state.accounts[nm];
        await save();
        rebuild();
        render();
        return;
      }
      const act = e.target.closest("[data-act]");
      if (!act) return;
      const a = act.dataset.act;
      if (a === "load") $("#file").click();
      else if (a === "sample") {
        state = sampleState();
        rebuild();
        ui.open.clear();
        render(true);
        $("#report").innerHTML = "";
      } else if (a === "more") {
        ui.limit += 100;
        renderTx();
      } else if (a === "toap") {
        const c = $("#apCard");
        if (c) {
          const d = c.querySelector("details");
          if (d) d.open = true;
          c.scrollIntoView({ behavior: "smooth", block: "start" });
        }
      } else if (a === "addnum") {
        const v = digits($("#apNum").value);
        if (v.length < 4) {
          $("#apNum").focus();
          return;
        }
        state.aporteNums = [...new Set([...(state.aporteNums || []), v])];
        await save();
        rebuild();
        render();
      } else if (a === "print") window.print();
      else if (a === "deck") buildDeck();
      else if (a === "copy") {
        const el = $("#doc");
        try {
          await navigator.clipboard.writeText(el.innerText);
          act.textContent = "Copiado";
        } catch (err) {
          const rg = document.createRange();
          rg.selectNodeContents(el);
          const s = getSelection();
          s.removeAllRanges();
          s.addRange(rg);
          act.textContent = "Selecionado: use Ctrl+C";
        }
        setTimeout(() => {
          act.textContent = "Copiar texto";
        }, 2500);
      } else if (a === "clear") {
        if (!confirmStep(act, "Confirmar: limpar tudo")) return;
        const keep = {
          planoSet: state.planoSet || {},
          aporteDest: state.aporteDest || {},
          aporteOrig: state.aporteOrig || {},
          aporteNums: state.aporteNums || [],
        };
        state = { accounts: {}, updatedAt: null, embedded: false, ...keep };
        await save();
        rebuild();
        render();
        $("#report").innerHTML = "";
      }
    });
    document.addEventListener("change", async (e) => {
      if (e.target.matches("#dFrom,#dTo")) {
        ui.preset = "custom";
        ui.from = $("#dFrom").value || null;
        ui.to = $("#dTo").value || null;
        render();
        return;
      }
      if (e.target.matches("#rsub")) {
        ui.rsub = e.target.checked;
        render();
        return;
      }
      if (e.target.matches("[data-orig]")) {
        state.aporteOrig = state.aporteOrig || {};
        state.aporteOrig[e.target.dataset.orig] = e.target.checked;
        const y = window.scrollY;
        await save();
        rebuild();
        render();
        window.scrollTo(0, y);
        return;
      }
      if (e.target.matches("[data-dest]")) {
        state.aporteDest = state.aporteDest || {};
        state.aporteDest[e.target.dataset.dest] = e.target.checked;
        const y = window.scrollY;
        await save();
        rebuild();
        render();
        window.scrollTo(0, y);
        return;
      }
      if (e.target.matches("[data-plano]")) {
        const nm = e.target.closest("tr").dataset.a;
        const acc = state.accounts[nm];
        if (!acc) return;
        state.planoSet = state.planoSet || {};
        if (e.target.value) state.planoSet[acc.srcName || acc.name] = e.target.value;
        else delete state.planoSet[acc.srcName || acc.name];
        await save();
        rebuild();
        render();
        return;
      }
    });
    let qt;
    document.addEventListener("input", (e) => {
      if (e.target.matches("#q")) {
        clearTimeout(qt);
        qt = setTimeout(() => {
          ui.q = e.target.value;
          ui.limit = 50;
          renderTx();
        }, 140);
      }
    });
    document.addEventListener("keydown", (e) => {
      if (e.target.matches("#apNum") && e.key === "Enter") {
        e.preventDefault();
        document.querySelector('[data-act="addnum"]').click();
        return;
      }
      if (e.target.matches(".drop-zone") && (e.key === "Enter" || e.key === " ")) {
        e.preventDefault();
        $("#file").click();
      }
    });
    let armT = null;
    function confirmStep(btn, label) {
      if (btn.dataset.armed) {
        delete btn.dataset.armed;
        btn.classList.remove("danger");
        btn.textContent = btn.dataset.orig;
        clearTimeout(armT);
        return true;
      }
      btn.dataset.orig = btn.textContent;
      btn.dataset.armed = "1";
      btn.classList.add("danger");
      btn.textContent = label;
      armT = setTimeout(() => {
        delete btn.dataset.armed;
        btn.classList.remove("danger");
        btn.textContent = btn.dataset.orig;
      }, 3500);
      return false;
    }
    $("#btnLoad").onclick = () => {
      if (ui.view !== "planilhas") location.hash = "planilhas";
      else $("#file").click();
    };
    $("#btnSync").onclick = updateAll;
    $("#btnDeck").onclick = buildDeck;
    $("#file").onchange = (e) => {
      const l = e.target.files;
      if (l && l.length) handleFiles(l);
      e.target.value = "";
    };
    $("#foldIn").onchange = (e) => {
      const l = e.target.files;
      if (l && l.length) folderFromInput(l);
      e.target.value = "";
    };
    const autoSync = () => {
      if (document.visibilityState !== "visible") return;
      if (SPR.cfg.active) syncSPR(false);
      else if (SP.cfg.active) syncSP(false);
      else syncFolder(false);
    };
    document.addEventListener("visibilitychange", autoSync);
    setInterval(autoSync, 5 * 60 * 1000);
    let dragN = 0;
    const drop = $("#drop");
    const hasFiles = (e) => [...(e.dataTransfer?.types || [])].includes("Files");
    window.addEventListener("dragenter", (e) => {
      if (hasFiles(e)) {
        e.preventDefault();
        dragN++;
        drop.hidden = false;
      }
    });
    window.addEventListener("dragover", (e) => {
      if (hasFiles(e)) e.preventDefault();
    });
    window.addEventListener("dragleave", () => {
      dragN = Math.max(0, dragN - 1);
      if (!dragN) drop.hidden = true;
    });
    window.addEventListener("drop", (e) => {
      if (!e.dataTransfer?.files?.length) return;
      e.preventDefault();
      dragN = 0;
      drop.hidden = true;
      handleFiles(e.dataTransfer.files);
    });
    let rz;
    window.addEventListener("resize", () => {
      clearTimeout(rz);
      rz = setTimeout(() => {
        movePill();
        if (chartArgs && document.body.contains(chartArgs[0])) drawChart(...chartArgs);
      }, 120);
    });
    if (document.fonts && document.fonts.ready)
      document.fonts.ready.then(() => {
        firstPill = true;
        movePill();
      });

    /* ---------- início ---------- */
    try {
      const p = JSON.parse(localStorage.getItem(STORE + "-prefs2") || "null");
      if (p) {
        if (p.preset && p.preset !== "custom") ui.preset = p.preset;
        if (p.rplan) ui.rplan = p.rplan;
        ui.rsub = !!p.rsub;
      }
    } catch (e) {}
    route(false);
    (async () => {
      const ok = await load();
      if (!ok) state = { accounts: {}, updatedAt: null, embedded: false };
      rebuild();
      if (ok) await save();
      if (PASTA.ok) {
        try {
          const h = await IDB.get("pasta");
          if (h) {
            PASTA.handle = h;
            PASTA.perm = await h.queryPermission({ mode: "read" });
          }
        } catch (e) {}
      }
      booting = false;
      render();
      renderFolder();
      if (SPR.cfg.active && SPR.ok) syncSPR(false);
      else if (SP.cfg.active && SP.ok) syncSP(false);
      else if (PASTA.handle && PASTA.perm === "granted") syncFolder(false);
      const velhas = ORDER.filter((n) => {
        const a = state.accounts[n];
        return a.src !== "pasta" && (a.pv || 1) < PARSER_V;
      });
      const pastaVelha =
        Object.values(state.files || {}).some((f) => !f.ignored && (f.pv || 1) < PARSER_V) &&
        !(PASTA.handle && PASTA.perm === "granted");
      if (!state.embedded && (velhas.length || pastaVelha))
        showReport([
          {
            ok: false,
            file: "Aportes (NP)",
            msg: `o painel agora conta as linhas NP como aportes. ${velhas.length ? `Carregue de novo ${velhas.length === 1 ? "a planilha" : "as planilhas"} ${esc(velhas.join(", "))} ` : ""}${pastaVelha ? (velhas.length ? "e clique em <b>Atualizar tudo</b> " : "Clique em <b>Atualizar tudo</b> ") : ""}para incluir as NP que já estavam nelas.`,
          },
        ]);
    })();
  })();
</script>
  </body>
</html>
